# Tema base de la aplicación SmartCityNet — "claro científico/ingeniería".
# Fija el modo claro y la paleta para que los widgets nativos de Streamlit
# (sliders, tabs, dataframes, st.metric, expanders, botones) armonicen con el
# CSS inyectado en frontend/estilos.py. Ver el rediseño del frontend.
[theme]
base = "light"
primaryColor = "#2557a7"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f1b2d"
font = "sans serif"

[server]
# Evita que Streamlit intente abrir el navegador al desplegar en servidor.
headless = true
